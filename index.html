<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LTO Practice Exam</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>
    <div class="app-container">
        <!-- Floating particles for background -->
        <div class="particles" aria-hidden="true">
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
        </div>

        <!-- Start Screen -->
        <div id="start-screen" class="screen active">
            <div class="hero-badge">🚗 LTO Philippines</div>
            <h1 class="hero-title" aria-label="LTO Practice Exam">
                <span class="letter" style="--i:0">L</span><span class="letter" style="--i:1">T</span><span class="letter" style="--i:2">O</span><span class="letter space" style="--i:3">&nbsp;</span><span class="letter" style="--i:4">P</span><span class="letter" style="--i:5">r</span><span class="letter" style="--i:6">a</span><span class="letter" style="--i:7">c</span><span class="letter" style="--i:8">t</span><span class="letter" style="--i:9">i</span><span class="letter" style="--i:10">c</span><span class="letter" style="--i:11">e</span><span class="letter space" style="--i:12">&nbsp;</span><span class="letter" style="--i:13">E</span><span class="letter" style="--i:14">x</span><span class="letter" style="--i:15">a</span><span class="letter" style="--i:16">m</span>
            </h1>
            <p class="hero-subtitle">Test your knowledge with these <strong>120</strong> LTO exam questions.</p>
            <p class="hero-info">Passing score: <strong>96/120 (80%)</strong></p>
            <h2 class="hero-author">Prepared by: Ajax Alyson</h2>
            <button id="start-btn" class="primary-btn glow-btn">🚀 Start Exam</button>
        </div>

        <!-- Quiz Screen -->
        <div id="quiz-screen" class="screen">
            <div class="header">
                <div class="progress">Question <span id="current-q-num">1</span> of <span id="total-q-num">10</span>
                </div>
                <!-- <div class="timer">Time Left: <span id="time-left">20:00</span></div> -->
            </div>

            <div class="question-container">
                <h2 id="question-text">Question text here</h2>
                <div id="options-container" class="options-grid">
                    <!-- Options injected here -->
                </div>
            </div>

            <div class="footer">
                <button id="prev-btn" class="secondary-btn" disabled>Previous</button>
                <button id="next-btn" class="primary-btn">Next</button>
                <button id="submit-btn" class="primary-btn hidden">Submit Exam</button>
            </div>
        </div>

        <!-- Results Screen -->
        <div id="results-screen" class="screen">
            <h1>Exam Results</h1>
            <div class="score-card">
                <div class="score-circle">
                    <span id="score-text">0/10</span>
                </div>
                <p id="score-message">Good job!</p>
            </div>

            <div class="review-section">
                <h2>Review Answers</h2>
                <div id="review-container">
                    <!-- Review items injected here -->
                </div>
            </div>

            <button id="restart-btn" class="primary-btn">Take Exam Again</button>
        </div>
    </div>

    <script src="questions.js"></script>
    <script src="script.js"></script>
</body>

</html>
